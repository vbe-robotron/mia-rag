[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mia-rag"
version = "0.3.0"
description = "Local web UI and CLI for RAG over 20 classic works of Marxist political economy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "vbe-robotron" }]
keywords = ["rag", "marxist-economics", "fastapi", "ollama", "opencode"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Education",
]
dependencies = ["numpy>=1.24", "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]

[project.scripts]
mia-rag = "mia_rag.cli:main"
mia-rag-web = "mia_rag.web:main"

[project.urls]
Homepage = "https://github.com/vbe-robotron/mia-rag"

[tool.hatch.build.targets.wheel]
packages = ["src/mia_rag"]
